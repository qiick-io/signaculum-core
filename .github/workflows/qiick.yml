# qiick checks, from qiick-io/app-ui at the pinned release (docs/new-product.md).
# Bump the workflow refs together with "ref" in qiick-standards.json.
# distribution-smoke calls app-ui app-distribution-smoke.yml (signaculum:install / upgrade).
name: qiick

on:
  push:
    branches: [develop, main]
  # All PR bases (incl. stacked feat/* → feat/*), so drift/php/ui gates run on #3/#4 too.
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  pr-title:
    if: github.event_name == 'pull_request'
    uses: qiick-io/app-ui/.github/workflows/pr-title.yml@0d97ae1429a856411c76e6de1ec258cae0eabab6

  app-ui-drift:
    uses: qiick-io/app-ui/.github/workflows/drift-check.yml@0d97ae1429a856411c76e6de1ec258cae0eabab6
    with:
      standards: true

  php-quality:
    uses: qiick-io/app-ui/.github/workflows/php-quality.yml@88c526a407710ae5cc1acd5c7848432b21c42f9e # app-ui develop after #291
    with:
      phpstan-max-advisory: true
      # Generate one Passport key pair before parallel Pest workers start.
      build-command: php artisan passport:keys --ansi && npm ci && npm run build

  ui-quality:
    uses: qiick-io/app-ui/.github/workflows/ui-quality.yml@0d97ae1429a856411c76e6de1ec258cae0eabab6

  migrations-frozen:
    uses: qiick-io/app-ui/.github/workflows/migrations-frozen.yml@0d97ae1429a856411c76e6de1ec258cae0eabab6

  # Check name for required checks: distribution-smoke / smoke
  distribution-smoke:
    uses: qiick-io/app-ui/.github/workflows/app-distribution-smoke.yml@0d97ae1429a856411c76e6de1ec258cae0eabab6
    with:
      package: qiick/signaculum-core
      command: signaculum
