name: conformance

on:
  push:
    branches:
      - develop
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  conformance:
    uses: qiick-io/app-ui/.github/workflows/conformance.yml@f613af9febfce3b6d7f7f41785e9845a610080c7
    with:
      php-version: '8.4'
      composer-command: composer install --no-interaction --prefer-dist --no-progress
      build-command: npm ci && npm run build
      pest-arguments: --group=conformance
