# OpenID Foundation conformance suite (S7 / #33).
# Own commit on purpose: workflow changes stay reviewable alone.
# The suite takes several minutes of three containers and a browser, so it runs
# on every push to develop and once a night (the nightly run also catches drift
# in the pinned suite's dependencies), not on every pull request.
name: oidc-conformance

on:
  push:
    branches: [develop]
  schedule:
    - cron: '17 2 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  # Never cancel on main or develop: those runs are the release evidence.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/develop' }}

env:
  CONFORMANCE_SUITE_REF: release-v5.1.43
  CONFORMANCE_ALIAS: signaculum-${{ github.run_id }}
  SIGNACULUM_BASE_URL: https://signaculum-proxy:8443
  CONFORMANCE_SUITE_PUBLIC_URL: https://nginx:8443
  CONFORMANCE_BACKCHANNEL_BASE_URL: https://localhost:8443
  OIDC_TEST_USER: conformance@signaculum.test
  OIDC_TEST_PASSWORD: ConformanceTest-Password-1
  OIDC_CLIENT_ID_1: 11111111-1111-4111-8111-111111111111
  OIDC_CLIENT_SECRET_1: signaculum-conformance-basic-secret-00001
  OIDC_CLIENT_ID_2: 22222222-2222-4222-8222-222222222222
  OIDC_CLIENT_SECRET_2: signaculum-conformance-basic-secret-00002
  OIDC_LOGOUT_CLIENT_ID: 33333333-3333-4333-8333-333333333333
  OIDC_LOGOUT_CLIENT_SECRET: signaculum-conformance-logout-secret-00001
  OIDC_BACKCHANNEL_CLIENT_ID: 44444444-4444-4444-8444-444444444444
  OIDC_BACKCHANNEL_CLIENT_SECRET: signaculum-conformance-backchannel-secret-00001

jobs:
  oidc-conformance:
    name: oidc-conformance
    runs-on: ubuntu-latest
    # A healthy run takes well under this; a broken login used to retry until
    # a 90-minute timeout and report only "cancelled".
    timeout-minutes: 45

    steps:
      - name: Checkout Signaculum
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          path: signaculum-core
          # The classify step below compares the diff against the base commit.
          fetch-depth: 0

      # The suite is the most expensive job in the repository, and a
      # documentation commit cannot change OIDC behaviour. The steps below are
      # gated on this classification instead of a workflow-level "paths:"
      # filter, so every push to develop reports an oidc-conformance result.
      # The classification is deliberately one-sided. Only a diff that is
      # documentation from end to end skips the suite, and anything unexpected
      # (a new branch, a force push, a base commit that is not in the
      # checkout, an empty diff) runs it.
      - name: Classify the diff
        id: classify
        working-directory: signaculum-core
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          run_suite() {
            echo "$1"
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          }

          if [ -z "${BASE_SHA}" ] || [ "${BASE_SHA}" = "0000000000000000000000000000000000000000" ]; then
            run_suite "No base commit for this event: running the conformance suite."
          fi

          if ! git cat-file -e "${BASE_SHA}^{commit}" 2> /dev/null; then
            run_suite "Base commit ${BASE_SHA} is not in this checkout: running the conformance suite."
          fi

          changed_files="$(git diff --name-only "${BASE_SHA}" "${HEAD_SHA}")"
          echo "Changed files:"
          echo "${changed_files}"

          if [ -z "${changed_files}" ]; then
            run_suite "Empty diff: running the conformance suite."
          fi

          code_files="$(printf '%s\n' "${changed_files}" \
            | grep -Ev '(^docs/|^\.github/ISSUE_TEMPLATE/|\.md$|^LICENSE$)' || true)"

          if [ -n "${code_files}" ]; then
            run_suite "Changes outside documentation: running the conformance suite."
          fi

          echo "Documentation-only diff: the conformance suite is not needed."
          echo "code=false" >> "$GITHUB_OUTPUT"

      - name: Setup PHP
        if: steps.classify.outputs.code == 'true'
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.4'
          tools: composer:v2
          coverage: none
          extensions: bcmath, intl, pcntl, pdo_sqlite, zip

      - name: Setup Node
        if: steps.classify.outputs.code == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26'

      - name: Setup Java
        if: steps.classify.outputs.code == 'true'
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '21'

      - name: Install and build Signaculum
        if: steps.classify.outputs.code == 'true'
        working-directory: signaculum-core
        run: |
          composer install --no-interaction --prefer-dist --no-progress
          cp .env.example .env
          php artisan key:generate --force
          mkdir -p database
          touch database/database.sqlite
          {
            echo 'APP_ENV=local'
            echo 'APP_DEBUG=true'
            echo 'APP_URL=https://signaculum-proxy:8443'
            echo 'OIDC_ISSUER=https://signaculum-proxy:8443'
            echo 'OIDC_REQUIRE_PKCE=false'
            echo 'OIDC_REQUIRE_NONCE=false'
            echo 'TRUSTED_PROXIES=*'
            echo 'DB_CONNECTION=sqlite'
            echo 'DB_DATABASE='"$(pwd)/database/database.sqlite"
            echo 'QUEUE_CONNECTION=sync'
            echo 'SESSION_DRIVER=file'
            echo 'CACHE_STORE=file'
            echo 'MAIL_MAILER=array'
          } >> .env
          php artisan migrate --force --no-interaction
          php artisan passport:keys --force
          npm ci
          npm run build

      - name: Seed conformance user and clients
        if: steps.classify.outputs.code == 'true'
        working-directory: signaculum-core
        run: php conformance/seed.php

      - name: Start Signaculum
        if: steps.classify.outputs.code == 'true'
        working-directory: signaculum-core
        run: |
          php artisan serve --host=0.0.0.0 --port=8080 > ../signaculum-server.log 2>&1 &
          echo $! > ../signaculum-server.pid
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:8080/health/live > /dev/null; then
              exit 0
            fi
            sleep 2
          done
          cat ../signaculum-server.log
          exit 1

      - name: Checkout OpenID conformance suite
        if: steps.classify.outputs.code == 'true'
        run: |
          git clone --depth 1 --branch "${CONFORMANCE_SUITE_REF}" --single-branch \
            https://gitlab.com/openid/conformance-suite.git conformance-suite
          echo "Using OpenID conformance suite ${CONFORMANCE_SUITE_REF} at $(git -C conformance-suite rev-parse HEAD)"

      - name: Build and start OpenID conformance suite
        if: steps.classify.outputs.code == 'true'
        env:
          SIGNACULUM_CONFORMANCE_DIR: ${{ github.workspace }}/signaculum-core/conformance
        run: |
          sudo sh -c 'echo "127.0.0.1 nginx" >> /etc/hosts'
          sudo sh -c 'echo "127.0.0.1 signaculum-proxy" >> /etc/hosts'
          sudo sh -c 'echo "127.0.0.1 chrome" >> /etc/hosts'
          cd conformance-suite
          mvn -B -DskipTests package
          docker compose \
            -f docker-compose-localtest.yml \
            -f "${SIGNACULUM_CONFORMANCE_DIR}/docker-compose.ci.yml" \
            up -d --build mongodb nginx server chrome signaculum-proxy
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:4444/status > /dev/null 2>&1; then
              echo "Chrome/Selenium is ready"
              break
            fi
            sleep 2
          done
          for attempt in $(seq 1 60); do
            if curl --insecure --fail --silent https://127.0.0.1:8443/api/runner/available > /dev/null; then
              exit 0
            fi
            sleep 5
          done
          docker compose \
            -f docker-compose-localtest.yml \
            -f "${SIGNACULUM_CONFORMANCE_DIR}/docker-compose.ci.yml" \
            logs server nginx chrome signaculum-proxy
          exit 1

      # Fail in seconds, not after every module has timed out, when the TLS
      # proxy cannot serve Signaculum's login page (it answered 502 once,
      # because Laravel's response headers outgrew nginx's buffer).
      - name: Check the Signaculum proxy
        if: steps.classify.outputs.code == 'true'
        run: |
          for attempt in $(seq 1 30); do
            if curl --insecure --fail --silent --show-error --output /dev/null \
              --header 'Host: signaculum-proxy:8443' https://127.0.0.1:9443/login; then
              exit 0
            fi
            sleep 2
          done
          docker logs "$(docker ps --quiet --filter name=signaculum-proxy)" 2>&1 | tail -n 50
          exit 1

      - name: Trust suite TLS certificate for back-channel logout
        if: steps.classify.outputs.code == 'true'
        working-directory: signaculum-core
        run: |
          set -euo pipefail
          : > ../conformance-tls.log
          rm -f /tmp/openid-conformance-*.crt /tmp/openid-conformance-chain.pem
          for attempt in $(seq 1 30); do
            openssl s_client \
              -connect 127.0.0.1:8443 \
              -servername localhost \
              -showcerts </dev/null 2>> ../conformance-tls.log \
              | sed -n '/-----BEGIN CERTIFICATE-----/,/-----END CERTIFICATE-----/p' \
              > /tmp/openid-conformance-chain.pem || true
            if grep -q -- '-----BEGIN CERTIFICATE-----' /tmp/openid-conformance-chain.pem; then
              break
            fi
            echo "Waiting for conformance-suite TLS endpoint (${attempt}/30)" | tee -a ../conformance-tls.log
            sleep 2
          done
          test -s /tmp/openid-conformance-chain.pem
          awk '
            /-----BEGIN CERTIFICATE-----/ {
              certificate_index++;
              certificate_path=sprintf("/tmp/openid-conformance-%02d.crt", certificate_index);
              in_certificate=1
            }
            in_certificate { print > certificate_path }
            /-----END CERTIFICATE-----/ {
              in_certificate=0;
              close(certificate_path)
            }
          ' /tmp/openid-conformance-chain.pem
          sudo cp /tmp/openid-conformance-*.crt /usr/local/share/ca-certificates/
          sudo update-ca-certificates 2>&1 | tee -a ../conformance-tls.log

      - name: Install conformance runner dependencies
        if: steps.classify.outputs.code == 'true'
        run: python3 -m pip install --user httpx selenium

      - name: Write conformance plan configs
        if: steps.classify.outputs.code == 'true'
        run: |
          mkdir -p conformance-results conformance-config
          python3 signaculum-core/conformance/write-config.py \
            signaculum-core/conformance/configs/basic.json \
            conformance-config/basic.json
          python3 signaculum-core/conformance/write-config.py \
            signaculum-core/conformance/configs/logout.json \
            conformance-config/logout.json
          python3 signaculum-core/conformance/write-config.py \
            signaculum-core/conformance/configs/backchannel.json \
            conformance-config/backchannel.json
          python3 -m json.tool conformance-config/basic.json > /dev/null
          python3 -m json.tool conformance-config/logout.json > /dev/null
          python3 -m json.tool conformance-config/backchannel.json > /dev/null

      - name: Run OIDC conformance plans
        if: steps.classify.outputs.code == 'true'
        timeout-minutes: 35
        env:
          CONFORMANCE_DEV_MODE: 1
          CONFORMANCE_SERVER: https://nginx:8443/
          CONFORMANCE_SERVER_MTLS: https://nginx:8444/
          SELENIUM_REMOTE_URL: http://127.0.0.1:4444/wd/hub
          CONFORMANCE_BROWSER_VISIT_TIMEOUT: 90
          CONFORMANCE_BROWSER_LOGIN_REDIRECT_TIMEOUT: 60
          # On the host, port 8443 of 127.0.0.1 is the suite's nginx; the
          # Signaculum proxy is published on 9443 (docker-compose.ci.yml).
          SIGNACULUM_CONNECT_URL: https://127.0.0.1:9443
          CONFORMANCE_BROWSER_MAX_FAILURES: 5
          SIGNACULUM_CONFORMANCE_DIR: ${{ github.workspace }}/signaculum-core/conformance
        run: |
          cd conformance-suite
          : > ../conformance-runner.log
          test_plan_status=0
          missing_export_status=0

          run_conformance_plan() {
            local plan_invocation="$1"
            local config_path="$2"
            local export_pattern="$3"
            local plan_status=0

            echo "::group::Run ${plan_invocation}"
            (
              set -o pipefail
              python3 scripts/run-test-plan.py \
                --export-dir ../conformance-results \
                --verbose \
                "${plan_invocation}" \
                "${config_path}" 2>&1 | tee -a ../conformance-runner.log
            ) &
            local plan_pid=$!

            # The browser runner exits after repeated failed visits. Every
            # module would then wait for a browser that never comes, so stop
            # the plan at once instead of letting each module time out.
            while kill -0 "${plan_pid}" 2>/dev/null; do
              if ! kill -0 "${browser_runner_pid}" 2>/dev/null; then
                echo "::error::The browser runner stopped; see conformance-browser.log"
                pkill -P "${plan_pid}" 2>/dev/null || true
                kill "${plan_pid}" 2>/dev/null || true
                break
              fi
              sleep 5
            done

            set +e
            wait "${plan_pid}"
            plan_status=$?
            set -e
            echo "::endgroup::"

            if ! kill -0 "${browser_runner_pid}" 2>/dev/null; then
              exit 1
            fi

            if [ "${plan_status}" -ne 0 ]; then
              test_plan_status="${plan_status}"
            fi

            if ! compgen -G "${export_pattern}" > /dev/null; then
              echo "Missing expected conformance export matching ${export_pattern}" >&2
              missing_export_status=1
              if [ "${test_plan_status}" -eq 0 ]; then
                test_plan_status=1
              fi
            fi
          }

          : > ../conformance-browser.log
          PYTHONUNBUFFERED=1 python3 ../signaculum-core/conformance/browser-runner.py \
            >> ../conformance-browser.log 2>&1 &
          browser_runner_pid=$!
          tail -n +1 -f ../conformance-browser.log &
          browser_log_tail_pid=$!
          cleanup_browser_runner() {
            kill "${browser_runner_pid}" 2>/dev/null || true
            kill "${browser_log_tail_pid}" 2>/dev/null || true
            wait "${browser_runner_pid}" 2>/dev/null || true
            wait "${browser_log_tail_pid}" 2>/dev/null || true
          }
          trap cleanup_browser_runner EXIT

          run_conformance_plan \
            "oidcc-basic-certification-test-plan[server_metadata=discovery][client_registration=static_client]" \
            ../conformance-config/basic.json \
            "../conformance-results/oidcc-basic-certification-test-plan-*.zip"

          run_conformance_plan \
            "oidcc-rp-initiated-logout-certification-test-plan[response_type=code][client_registration=static_client]" \
            ../conformance-config/logout.json \
            "../conformance-results/oidcc-rp-initiated-logout-certification-test-plan-*.zip"

          run_conformance_plan \
            "oidcc-backchannel-rp-initiated-logout-certification-test-plan[response_type=code][client_registration=static_client]" \
            ../conformance-config/backchannel.json \
            "../conformance-results/oidcc-backchannel-rp-initiated-logout-certification-test-plan-*.zip"

          cleanup_browser_runner
          trap - EXIT

          echo "::group::Failing modules (if any)"
          python3 ../signaculum-core/conformance/check-results.py \
            --results-dir ../conformance-results || true
          echo "::endgroup::"

          set +e
          python3 ../signaculum-core/conformance/check-results.py \
            --results-dir ../conformance-results
          blocking_status=$?
          set -e

          if [ "${blocking_status}" -ne 0 ]; then
            if [ "${test_plan_status}" -ne 0 ]; then
              exit "${test_plan_status}"
            fi
            exit "${blocking_status}"
          fi

          if [ "${missing_export_status}" -ne 0 ]; then
            exit "${test_plan_status}"
          fi

          if [ "${test_plan_status}" -ne 0 ]; then
            echo "Conformance suite exited with ${test_plan_status}, but exported results contain only non-blocking WARNING/REVIEW outcomes."
          fi

      - name: Collect conformance diagnostics
        if: always() && steps.classify.outputs.code == 'true'
        env:
          SIGNACULUM_CONFORMANCE_DIR: ${{ github.workspace }}/signaculum-core/conformance
        run: |
          if [ -d conformance-suite ]; then
            (
              cd conformance-suite
              docker compose \
                -f docker-compose-localtest.yml \
                -f "${SIGNACULUM_CONFORMANCE_DIR}/docker-compose.ci.yml" \
                logs --no-color server nginx chrome signaculum-proxy
            ) > conformance-suite.log 2>&1 || true
          fi
          if [ -f signaculum-server.pid ]; then
            kill "$(cat signaculum-server.pid)" 2>/dev/null || true
          fi

      - name: Upload conformance results
        if: always() && steps.classify.outputs.code == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: oidc-conformance-results
          path: |
            conformance-results
            conformance-runner.log
            conformance-browser.log
            conformance-tls.log
            conformance-suite.log
            signaculum-server.log
          if-no-files-found: warn
