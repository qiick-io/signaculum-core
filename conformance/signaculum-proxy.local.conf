worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    access_log /dev/stdout;
    error_log /dev/stderr;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    ssl_certificate /etc/ssl/certs/nginx-selfsigned.crt;
    ssl_certificate_key /etc/ssl/private/nginx-selfsigned.key;

    server {
        listen 8443 ssl;
        server_name signaculum-proxy;

        client_header_buffer_size 32k;
        large_client_header_buffers 4 32k;

        location / {
            proxy_pass http://signaculum:8080;
            proxy_http_version 1.1;
            proxy_set_header Host signaculum-proxy:8443;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-Host signaculum-proxy;
            proxy_set_header X-Forwarded-Port 8443;
            proxy_set_header X-Forwarded-Uri $request_uri;
            proxy_set_header Forwarded "by=$server_addr;for=$remote_addr;host=signaculum-proxy;proto=https";
            proxy_pass_request_headers on;
            # Laravel session + XSRF cookies exceed nginx's default upstream header buffer.
            proxy_buffer_size 128k;
            proxy_buffers 4 256k;
            proxy_busy_buffers_size 256k;
            proxy_buffering on;
        }
    }
}
