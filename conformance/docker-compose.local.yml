# Docker-only local overlay for Mac hosts that cannot edit /etc/hosts or run
# Signaculum on the host. Compose DNS resolves nginx / signaculum-proxy / chrome.
# Use with the suite's docker-compose-localtest.yml and docker-compose.ci.yml.
services:
    # Sample OP from the suite compose file; we do not need it. Keep depends_on
    # happy without binding host :3000 (often already taken) or pulling amd64-only.
    oidcc-provider:
        image: busybox:1.36
        platform: linux/arm64
        entrypoint: ['sleep', 'infinity']
        ports: !reset []
        volumes: !reset []

    server:
        depends_on: !override
            - mongodb

    signaculum:
        image: dunglas/frankenphp:1-php8.4-alpine
        working_dir: /app
        volumes:
            - ${SIGNACULUM_CORE}:/app
            - ${SIGNACULUM_CONFORMANCE_DIR}/local-certs:/certs:ro
        environment:
            APP_ENV: local
            APP_DEBUG: 'true'
            APP_URL: https://signaculum-proxy:8443
            OIDC_ISSUER: https://signaculum-proxy:8443
            OIDC_REQUIRE_PKCE: 'false'
            OIDC_REQUIRE_NONCE: 'false'
            TRUSTED_PROXIES: '*'
            DB_CONNECTION: sqlite
            DB_DATABASE: /app/database/database.sqlite
            QUEUE_CONNECTION: sync
            SESSION_DRIVER: file
            CACHE_STORE: file
            MAIL_MAILER: array
        command:
            - /bin/sh
            - -c
            - |
                set -e
                # Trust the suite nginx cert (CN=localhost) for back-channel logout HTTPS.
                if [ -f /certs/suite-ca.pem ]; then
                  cp /certs/suite-ca.pem /usr/local/share/ca-certificates/suite-ca.crt
                  update-ca-certificates
                fi
                # Suite cert is CN=localhost; forward local 8443 to the suite nginx so
                # seeded back-channel URIs (https://localhost:8443/...) verify cleanly.
                apk add --no-cache socat >/dev/null
                socat TCP-LISTEN:8443,fork,reuseaddr TCP:nginx:8443 &
                php artisan serve --host=0.0.0.0 --port=8080
        healthcheck:
            test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:8080/health/live']
            interval: 5s
            timeout: 3s
            retries: 30
            start_period: 20s
        depends_on:
            - nginx

    signaculum-proxy:
        volumes:
            - '${SIGNACULUM_CONFORMANCE_DIR}/signaculum-proxy.local.conf:/etc/nginx/nginx.conf:ro'
        depends_on:
            signaculum:
                condition: service_started

    runner:
        image: python:3.12-slim
        working_dir: /work
        volumes:
            - ${SIGNACULUM_CORE}:/signaculum:ro
            - ${CONFORMANCE_SUITE_DIR}:/work
            - ${CONFORMANCE_RESULTS_DIR}:/results
            - ${CONFORMANCE_CONFIG_DIR}:/config:ro
            - ${SIGNACULUM_CONFORMANCE_DIR}/local-certs:/certs:ro
        environment:
            CONFORMANCE_DEV_MODE: '1'
            CONFORMANCE_SERVER: https://nginx:8443/
            CONFORMANCE_SERVER_MTLS: https://nginx:8444/
            SELENIUM_REMOTE_URL: http://chrome:4444/wd/hub
            CONFORMANCE_BROWSER_VISIT_TIMEOUT: '90'
            CONFORMANCE_BROWSER_LOGIN_REDIRECT_TIMEOUT: '60'
            SIGNACULUM_BASE_URL: https://signaculum-proxy:8443
            OIDC_TEST_USER: ${OIDC_TEST_USER}
            OIDC_TEST_PASSWORD: ${OIDC_TEST_PASSWORD}
            REQUESTS_CA_BUNDLE: /certs/suite-ca.pem
            SSL_CERT_FILE: /certs/suite-ca.pem
            CURL_CA_BUNDLE: /certs/suite-ca.pem
        depends_on:
            - nginx
            - chrome
            - signaculum-proxy
        # Suite scripts need httpx + pyparsing (see suite test/Dockerfile); selenium for browser-runner.
        entrypoint:
            - /bin/sh
            - -c
            - pip install --no-cache-dir httpx pyparsing selenium >/tmp/pip-install.log && sleep infinity
